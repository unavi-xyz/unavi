[project]
name     = "unavi-app"
revision = "1.0"

[profiles.default]
UNAVI_ALLOW_LOCAL_DIDS = { default = "false", description = "Whether to resolve did:web on loopback or private hosts, and over plaintext HTTP for localhost" }
UNAVI_DEV              = { default = "false", description = "Whether this is a development build" }
UNAVI_SYNC_TARGETS     = { default = "did:web:node.unavi.xyz", description = "Comma separated DIDs of the nodes this app follows" }

[profiles.development]
UNAVI_ALLOW_LOCAL_DIDS = { default = "true" }
UNAVI_DEV              = { default = "true" }
UNAVI_SYNC_TARGETS     = { default = "did:web:localhost%3A5000" }

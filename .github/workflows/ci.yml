name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: AdityaGarg8/remove-unwanted-software@v4
        with:
          remove-android: true
          remove-cached-tools: true
          remove-codeql: true
          remove-dotnet: true
          remove-haskell: true
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: DeterminateSystems/flake-checker-action@v13
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: extra-experimental-features = pipe-operators
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Put the devshell's cargo/rustc on PATH so the unwrappable rust-cache action can find them.
      - run: nix develop .#minimal --command printenv PATH >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: nix develop .#minimal --command just ci

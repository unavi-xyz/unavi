name: Build Nix
on:
  workflow_call:
    inputs:
      ref:
        description: ref to build
        type: string
jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: generate
        run: |
          # Graphical packages ship as AppImages; headless ones as plain bundles.
          APPIMAGE_PACKAGES=("unavi-client" "unavi-launcher")
          BUNDLE_PACKAGES=("unavi-server")
          # SYSTEMS=("x86_64-linux" "x86_64-darwin")
          SYSTEMS=("x86_64-linux")

          declare -A OS_MAP
          OS_MAP["x86_64-linux"]="ubuntu-latest"

          MATRIX="["
          for SYS in "${SYSTEMS[@]}"; do
            OS="${OS_MAP[$SYS]}"
            for PKG in "${APPIMAGE_PACKAGES[@]}"; do
              [ "$MATRIX" != "[" ] && MATRIX+=","
              MATRIX+="{\"package\":\"$PKG\",\"os\":\"$OS\",\"name\":\"$PKG-$SYS\",\"format\":\"appimage\"}"
            done
            for PKG in "${BUNDLE_PACKAGES[@]}"; do
              [ "$MATRIX" != "[" ] && MATRIX+=","
              MATRIX+="{\"package\":\"$PKG\",\"os\":\"$OS\",\"name\":\"$PKG-$SYS\",\"format\":\"bundle\"}"
            done
          done
          MATRIX+="]"

          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
  build:
    needs: set-matrix
    strategy:
      matrix:
        include: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: AdityaGarg8/remove-unwanted-software@v4
        with:
          remove-android: true
          remove-cached-tools: true
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: extra-experimental-features = pipe-operators
      - run: nix profile add nixpkgs#xz
      - name: Build AppImage
        if: ${{ matrix.format == 'appimage' }}
        run: |
          # The AppImage carries the full closure and a static runtime, so it
          # needs neither Nix nor an FHS host to start. Its squashfs payload is
          # already compressed, so no outer archive is worth the size; a manual
          # download costs a chmod +x, and the launcher sets that bit itself
          # when it installs an update.
          nix build -L -o result .#${{ matrix.package }}-appimage
          cp --dereference result ${{ matrix.name }}.AppImage
          chmod +x ${{ matrix.name }}.AppImage
          echo "ARTIFACT=${{ matrix.name }}.AppImage" >> "$GITHUB_ENV"
      - name: Build bundle
        if: ${{ matrix.format == 'bundle' }}
        run: |
          # Bundles the full closure so the artifact runs without Nix installed.
          nix bundle -L -o bundle .#${{ matrix.package }}
          cp --dereference bundle ${{ matrix.name }}
          chmod +x ${{ matrix.name }}
          # tar preserves the executable bit through download+extract; a bare
          # xz stream of the binary does not, since Unix permissions aren't
          # part of a compressed byte stream or an HTTP download.
          tar -cf - ${{ matrix.name }} | xz --x86 -9e -c > ${{ matrix.name }}.tar.xz
          echo "ARTIFACT=${{ matrix.name }}.tar.xz" >> "$GITHUB_ENV"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.name }}
          path: ${{ env.ARTIFACT }}
          retention-days: 1

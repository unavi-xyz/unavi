[project]
extends  = ["crates/unavi-client", "crates/unavi-server"]
name     = "unavi"
revision = "1.0"

[profiles.deploy]
AWS_ACCESS_KEY_ID         = { composed = "${SPACES_ACCESS_KEY_ID}", description = "DigitalOcean Spaces access key, for terraform's s3 state backend" }
AWS_SECRET_ACCESS_KEY     = { composed = "${SPACES_SECRET_ACCESS_KEY}", description = "DigitalOcean Spaces secret key, for terraform's s3 state backend" }
CLOUDFLARE_API_TOKEN      = { description = "Cloudflare API token, scoped to the unavi.xyz zone", required = true }
DIGITALOCEAN_ACCESS_TOKEN = { description = "DigitalOcean API token for droplets, DNS, and projects", required = true }
SPACES_ACCESS_KEY_ID      = { description = "DigitalOcean Spaces access key, for the digitalocean_spaces_bucket resource", required = true }
SPACES_SECRET_ACCESS_KEY  = { description = "DigitalOcean Spaces secret key, for the digitalocean_spaces_bucket resource", required = true }

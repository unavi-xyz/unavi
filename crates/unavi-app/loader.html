<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UNAVI" />
    <meta property="og:site_name" content="unavi.xyz" />
    <meta property="og:title" content="UNAVI" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.unavi.xyz/" />
    <meta property="twitter:domain" content="unavi.xyz" />
    <meta property="twitter:url" content="https://app.unavi.xyz/" />
    <title>UNAVI</title>
    <style>
      html,
      body {
        background-color: #e4d2df;
        margin: 0;
        height: 100%;
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background-color: #e4d2df;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 400ms ease-out;
      }

      .overlay.fading {
        opacity: 0;
        pointer-events: none;
      }

      /* The website's tokens: its field type, its signage, its mono. Progress
         is a row of thirty dots that light one at a time. */
      .pane {
        --fg: #0f0f0f;
        --muted: #666666;
        --red: #dc2626;
        --dot: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        max-width: calc(100vw - 32px);
        color: var(--fg);
      }

      .pane-title {
        font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.1;
        text-transform: uppercase;
      }

      .pane-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .progress {
        width: calc(var(--dot) * 30);
        max-width: 100%;
        height: var(--dot);
        overflow: hidden;
        background: radial-gradient(circle, rgba(15, 15, 15, 0.14) 0 36%, rgba(15, 15, 15, 0.001) 38%)
          0 0 / var(--dot) var(--dot);
      }

      .progress-fill {
        width: 0;
        height: 100%;
        background: radial-gradient(circle, var(--fg) 0 36%, rgba(15, 15, 15, 0.001) 38%) 0 0 /
          var(--dot) var(--dot);
      }

      .progress.indeterminate .progress-fill {
        width: calc(var(--dot) * 4);
        animation: march 2.6s steps(26) infinite;
      }

      @keyframes march {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(calc(var(--dot) * 26));
        }
      }

      .progress-label {
        min-height: 1.5em;
        color: var(--muted);
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
      }

      @media (prefers-reduced-motion: reduce) {
        .progress.indeterminate .progress-fill {
          animation: none;
          width: 0;
        }
      }

      .error {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .error .pane-title {
        color: var(--red);
        font-size: 14px;
        letter-spacing: 0.14em;
      }

      .error .reason {
        max-width: 32rem;
        overflow-wrap: anywhere;
        text-align: center;
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
      }

      .error button {
        padding: 12px 20px;
        border: 0;
        background: var(--fg);
        color: #f8f8f5;
        font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .error button:active {
        transform: scale(0.97);
      }

      .error button:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <div class="overlay" id="overlay">
      <div class="pane">
        <div class="pane-title">UNAVI</div>
        <div class="pane-body">
          <div class="progress indeterminate" id="progress">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-label" id="progress-label">connecting</div>
        </div>
      </div>
    </div>
    <noscript>UNAVI needs JavaScript enabled to load.</noscript>
    <script>
      (async function () {
        const state = {
          current: 0,
          total: null,
          starting: false,
          queued: false,
        };

        const showError = (e) => {
          console.error("Failed to load UNAVI:", e);
          const overlay = document.getElementById("overlay");
          if (overlay) overlay.remove();
          if (document.querySelector(".error")) return;

          const title = document.createElement("div");
          title.className = "pane-title";
          title.textContent = "failed to load";
          const reason = document.createElement("div");
          reason.className = "reason";
          reason.textContent = String(e);
          const reload = document.createElement("button");
          reload.type = "button";
          reload.textContent = "reload";
          reload.addEventListener("click", () => location.reload());
          const body = document.createElement("div");
          body.className = "pane-body";
          body.append(reason, reload);
          const pane = document.createElement("div");
          pane.className = "pane";
          pane.append(title, body);
          const message = document.createElement("div");
          message.className = "error";
          message.appendChild(pane);
          document.body.appendChild(message);
        };

        // The bar is 30 dots wide and lights a whole dot at a time.
        const CELLS = 30;

        const megabytes = (bytes) => (bytes / 1048576).toFixed(1);

        const render = () => {
          const bar = document.getElementById("progress");
          const fill = document.getElementById("progress-fill");
          const label = document.getElementById("progress-label");
          if (!bar || !fill || !label) return;

          const known = state.total !== null;
          bar.classList.toggle("indeterminate", !known && !state.starting);
          if (state.starting) {
            fill.style.width = "100%";
            label.textContent = "starting";
          } else if (known) {
            const fraction = Math.min(state.current / state.total, 1);
            fill.style.width = (Math.floor(fraction * CELLS) / CELLS) * 100 + "%";
            label.textContent = `downloading ${megabytes(state.current)} / ${megabytes(state.total)} MB`;
          } else if (state.current > 0) {
            label.textContent = `downloading ${megabytes(state.current)} MB`;
          }
        };

        // Progress events arrive per network chunk, so draws are batched to one
        // per animation frame.
        const schedule = () => {
          if (state.queued) return;
          state.queued = true;
          requestAnimationFrame(() => {
            state.queued = false;
            render();
          });
        };

        window.addEventListener("unavi-load-progress", (event) => {
          state.current = event.detail.current;
          schedule();
        });
        window.addEventListener("unavi-load-complete", () => {
          state.starting = true;
          schedule();
        });
        window.addEventListener("unavi-load-failed", (event) => {
          showError(event.detail.error);
        });

        try {
          // The uncompressed wasm sizes, which is what the decoded stream counts.
          const sizesPromise = fetch("/sizes.json", { cache: "no-cache" })
            .then((res) => (res.ok ? res.json() : null))
            .catch(() => null);

          let variant = "webgl";
          try {
            if (navigator.gpu && (await navigator.gpu.requestAdapter())) {
              variant = "webgpu";
            }
          } catch (e) {
            console.log("WebGPU detection failed, using WebGL:", e);
          }
          console.log("Loading variant:", variant);

          const sizes = await sizesPromise;
          const total = sizes && sizes[variant];
          if (typeof total === "number" && total > 0) {
            state.total = total;
            schedule();
          }

          // Bevy's wasm asset reader fetches "assets/..." relative to
          // `document.baseURI`, which without this stays "/" since this
          // document never navigates into the variant's own directory.
          const base = document.createElement("base");
          base.href = "/" + variant + "/";
          document.head.appendChild(base);

          // Fetch variant's index.html (paths already absolute from --public-url).
          const res = await fetch("/" + variant + "/index.html");
          if (!res.ok) {
            throw new Error(
              `fetching ${variant}/index.html: ${res.status} ${res.statusText}`,
            );
          }
          const html = await res.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, "text/html");

          // Inject link tags (paths already correct).
          doc
            .querySelectorAll(
              'link[rel="stylesheet"], link[rel="icon"], link[rel="preload"], link[rel="modulepreload"]',
            )
            .forEach((el) => {
              document.head.appendChild(el.cloneNode(true));
            });

          // The overlay stays over the canvas until the app reports its first
          // frames, then fades out and is removed.
          window.addEventListener(
            "unavi-ready",
            () => {
              const overlay = document.getElementById("overlay");
              if (!overlay) return;
              overlay.classList.add("fading");
              setTimeout(() => overlay.remove(), 450);
            },
            { once: true },
          );

          // A failure before Trunk can call onFailure, such as a missing
          // module or an import error, would otherwise leave the bar spinning.
          const failEarly = (event) => {
            if (document.getElementById("overlay")) {
              showError(event.reason ?? event.error ?? event.message);
            }
          };
          window.addEventListener("error", failEarly, { once: true });
          window.addEventListener("unhandledrejection", failEarly, {
            once: true,
          });
          window.addEventListener(
            "unavi-ready",
            () => {
              window.removeEventListener("error", failEarly);
              window.removeEventListener("unhandledrejection", failEarly);
            },
            { once: true },
          );

          // Inject and execute scripts (paths already correct).
          doc.querySelectorAll("script").forEach((el) => {
            const script = document.createElement("script");
            script.onerror = () => showError(`failed to load ${el.src}`);
            if (el.src) script.src = el.src;
            else script.textContent = el.textContent;
            if (el.type) script.type = el.type;
            document.body.appendChild(script);
          });
        } catch (e) {
          showError(e);
        }
      })();
    </script>
  </body>
</html>

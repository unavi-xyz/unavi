name: Release
on:
  workflow_dispatch:
    inputs:
      increment:
        description: version bump level
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Git config
        run: |
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config user.name github-actions
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3
      - run: |
          nix profile add nixpkgs#rustup
          rustup default nightly
          nix profile add nixpkgs#cargo-release
      - name: Bump version
        # launcher/ and hsd/ are separate workspaces (excluded from the root
        # so their lockfiles stay independent); bump all three together or
        # the launcher reports a stale CARGO_PKG_VERSION and update-loops
        # against the newly tagged release forever (J2).
        run: |
          cargo release version ${{ inputs.increment }} -x --no-confirm
          cargo release version ${{ inputs.increment }} -x --no-confirm --manifest-path launcher/Cargo.toml --workspace
          cargo release version ${{ inputs.increment }} -x --no-confirm --manifest-path hsd/Cargo.toml --workspace
          cargo update --workspace --manifest-path launcher/Cargo.toml
          cargo update --workspace --manifest-path hsd/Cargo.toml
      - name: Check versions agree
        run: nix develop .#minimal -c just check-versions
      - id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"//; s/"$//')
          echo "version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit to a release branch
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BRANCH="release/v$VERSION"

          if git show-ref --quiet "refs/remotes/origin/$BRANCH"; then
            git push origin --delete "$BRANCH"
          fi

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: bump version to $VERSION"
          git push origin "$BRANCH"
  build-nix:
    needs: version
    uses: ./.github/workflows/build-nix.yml
    with:
      ref: release/v${{ needs.version.outputs.version }}
  build-windows:
    needs: version
    uses: ./.github/workflows/build-windows.yml
    # Only the two secrets build-windows.yml declares, not every repo secret
    # (J7): it has no use for DEPLOY_SSH_KEY.
    secrets:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    with:
      ref: release/v${{ needs.version.outputs.version }}
  build-macos:
    needs: version
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: release/v${{ needs.version.outputs.version }}
  deploy:
    needs:
      - version
      - build-nix
      - build-windows
    uses: ./.github/workflows/deploy.yml
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    with:
      ref: release/v${{ needs.version.outputs.version }}
  publish:
    needs:
      - version
      - build-nix
      - build-windows
      - build-macos
      - deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Git config
        run: |
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config user.name github-actions
      - name: Fast-forward main and tag
        run: |
          VERSION=${{ needs.version.outputs.version }}
          git fetch origin "release/v$VERSION"
          git merge --ff-only "origin/release/v$VERSION"
          git tag "v$VERSION"
          git push origin main "v$VERSION"
      - name: Delete release branch
        run: git push origin --delete "release/v${{ needs.version.outputs.version }}"
  release:
    needs:
      - version
      - publish
      - build-nix
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: mkdir artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "build-*"
          path: artifacts
      - name: Add version to build file names
        run: |
          cd artifacts || exit
          for dir in *; do
            [ -d "$dir" ] || continue
            cd "$dir" || exit
            for file in *; do
              case "$file" in
                *.tar.xz)
                  base="${file%.tar.xz}"
                  mv "$file" "../${base}-${{ needs.version.outputs.version }}.tar.xz"
                  ;;
                *.*)
                  base="${file%.*}"
                  ext="${file##*.}"
                  mv "$file" "../${base}-${{ needs.version.outputs.version }}.${ext}"
                  ;;
                *)
                  mv "$file" "../${file}-${{ needs.version.outputs.version }}"
                  ;;
              esac
            done
            cd ..
            rm -rf "$dir"
          done
      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: artifacts/*
          generateReleaseNotes: true
          tag: v${{ needs.version.outputs.version }}

[package]
edition.workspace    = true
license.workspace    = true
name                 = "unavi-space"
publish              = false
repository.workspace = true
version.workspace    = true

[lints]
workspace = true

[features]
devtools = ["dep:unavi-devtools"]

[dependencies]
anyhow.workspace           = true
async-channel.workspace    = true
avian3d.workspace          = true
bevy.workspace             = true
bevy-hsd.path              = "../bevy-hsd"
bevy-iroh.path             = "../bevy-iroh"
bevy-wds.path              = "../bevy-wds"
blake3.workspace           = true
bytes.workspace            = true
half                       = { features = ["serde"], version = "2.7.1" }
hsd.path                   = "../hsd"
iroh.workspace             = true
iroh-blobs                 = { features = ["hide-proto-docs"], workspace = true }
iroh-docs.workspace        = true
iroh-gossip                = { features = ["net"], workspace = true }
n0-future.workspace        = true
parking_lot.workspace      = true
postcard.workspace         = true
rand.workspace             = true
serde.workspace            = true
serde_vrm                  = "0.4.0"
thiserror.workspace        = true
time.workspace             = true
tokio.workspace            = true
tracing.workspace          = true
unavi-agent.path           = "../unavi-agent"
unavi-avatar               = { path = "../unavi-avatar", version = "0.0.17" }
unavi-devtools             = { optional = true, path = "../unavi-devtools" }
unavi-manifold             = { path = "../unavi-manifold", version = "0.0.17" }
unavi-policy.path          = "../unavi-policy"
unavi-portal-protocol.path = "../unavi-portal-protocol"
unavi-quota.path           = "../unavi-quota"
unavi-registry.path        = "../unavi-registry"
unavi-util.path            = "../unavi-util"
wds.path                   = "../wds"
web-time.workspace         = true
xdid.workspace             = true

# Without this `OffsetDateTime::now_utc` reads the unimplemented wasm clock.
[target.'cfg(target_family = "wasm")'.dependencies]
time = { features = ["wasm-bindgen"], workspace = true }

[project]
name     = "unavi-client"
revision = "1.0"

[profiles.default]
UNAVI_ALLOW_LOOPBACK_SYNC_TARGETS = { default = "false", description = "Resolve sync targets whose did:web points at a loopback address" }
UNAVI_SYNC_TARGETS                = { default = "did:web:wds.unavi.xyz", description = "Comma separated DIDs of the servers this client follows" }

[profiles.development]
UNAVI_ALLOW_LOOPBACK_SYNC_TARGETS = { default = "true" }
UNAVI_SYNC_TARGETS                = { default = "did:web:localhost%3A5000" }

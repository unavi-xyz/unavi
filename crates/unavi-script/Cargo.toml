[package]
edition.workspace    = true
license.workspace    = true
name                 = "unavi-script"
publish              = false
repository.workspace = true
version.workspace    = true

[lints]
workspace = true

[dependencies]
async-channel.workspace = true
avian3d.workspace       = true
bevy                    = { default-features = true, workspace = true }
bevy-async.path         = "../bevy-async"
bevy-hsd.path           = "../bevy-hsd"
bevy-iroh.path          = "../bevy-iroh"
bevy_vrm.workspace      = true
blake3.workspace        = true
hsd.path                = "../hsd"
iroh.workspace          = true
iroh-docs.workspace     = true
n0-future.workspace     = true
parking_lot.workspace   = true
smol_str.workspace      = true
thiserror.workspace     = true
tokio.workspace         = true
tracing.workspace       = true
unavi-agent.path        = "../unavi-agent"
unavi-avatar.path       = "../unavi-avatar"
unavi-input.path        = "../unavi-input"
unavi-physics.path      = "../unavi-physics"
unavi-policy.path       = "../unavi-policy"
unavi-space.path        = "../unavi-space"
unavi-store.path        = "../unavi-store"
xdid.workspace          = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
wasmtime.workspace      = true
wasmtime-wasi.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
anyhow.workspace       = true
js-sys                 = "0.3.94"
serde                  = { features = ["derive"], workspace = true }
serde-wasm-bindgen     = "0.6.5"
serde_bytes            = "0.11.19"
wasm-bindgen.workspace = true
wasm-bindgen-futures   = "0.4.76"

[dev-dependencies]
bevy-inspector-egui.workspace  = true
bevy_panorbit_camera.workspace = true
directories.workspace          = true
iroh-blobs.workspace           = true
unavi-assets.path              = "../unavi-assets"
unavi-grab.path                = "../unavi-grab"
unavi-identity.path            = "../unavi-identity"
unavi-local.path               = "../unavi-local"

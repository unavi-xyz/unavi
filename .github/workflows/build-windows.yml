name: Build Windows
on:
  workflow_call:
    inputs:
      ref:
        description: ref to build
        type: string
    secrets:
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: extra-experimental-features = pipe-operators
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Generate missing WIT
        run: nix develop .#minimal -c nu scripts/update-wasm.nu --locked
      - name: Install npm dependencies
        run: nix develop .#minimal -c npm install --prefix crates/unavi-script
      - name: Build WASM assets
        run: nix develop .#minimal -c nu scripts/build-wasm.nu
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: assets
          path: crates/unavi-client/assets/hsd
          retention-days: 1
      - name: Upload WIT deps
        uses: actions/upload-artifact@v7
        with:
          name: protocol-wit-deps
          path: protocol/wit
          retention-days: 1
  build-windows:
    needs: build-wasm
    runs-on: windows-latest
    strategy:
      matrix:
        package: [unavi-client, unavi-launcher]
    name: ${{ matrix.package }}-x86_64-windows
    env:
      CERTIFICATE_PATH: certificate.pfx
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: assets
          path: crates/unavi-client/assets/hsd
      - name: Download WIT deps
        uses: actions/download-artifact@v8
        with:
          name: protocol-wit-deps
          path: protocol/wit
      - name: Remove example HSD assets
        shell: bash
        run: rm -f crates/unavi-client/assets/hsd/example_*.hsdz
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-14
          targets: x86_64-pc-windows-msvc
      - run: cargo install cargo-binstall --locked
      - run: cargo binstall cargo-wix --locked --no-confirm
      - name: Build package
        shell: bash
        run: cargo build -p ${{ matrix.package }} --release
      - name: Check DLL dependencies
        if: ${{ matrix.package == 'unavi-client' }}
        shell: powershell
        run: |
          Write-Host "=== Checking DLL dependencies ==="
          $dumpbin = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\dumpbin.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if ($dumpbin) {
            & $dumpbin /dependents target\release\unavi-client.exe
          }
      - name: Bundle VC++ runtime DLLs
        shell: powershell
        run: |
          # The exe links the MSVC CRT dynamically, so these must ship
          # alongside it — a bare Windows install doesn't have them.
          $dll = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Filter "vcruntime140.dll" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\Redist\\MSVC\\.*\\x64\\" } |
            Select-Object -First 1
          if (-not $dll) {
            Write-Error "Could not find VC++ redistributable directory"
            exit 1
          }
          $redist = $dll.DirectoryName
          Write-Host "Using redistributable: $redist"
          Copy-Item "$redist\vcruntime140.dll" -Destination target\release
          Copy-Item "$redist\vcruntime140_1.dll" -Destination target\release
          Copy-Item "$redist\msvcp140.dll" -Destination target\release
      - name: Setup code signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE }}
        shell: bash
        run: |
          if [ -n "$CERTIFICATE_BASE64" ]; then
            echo "$CERTIFICATE_BASE64" | base64 -d > "${{ env.CERTIFICATE_PATH }}"
            echo "SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          fi
      # Signing has to happen before wix runs, or the exe the installer
      # embeds is the unsigned one.
      - name: Sign executable
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          $certPath = "$env:CERTIFICATE_PATH"
          if (-not (Test-Path $certPath)) {
            Write-Error "Certificate file not found at: $certPath"
            exit 1
          }

          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $signtool) {
            Write-Error "signtool.exe not found"
            exit 1
          }

          Write-Host "Using certificate: $certPath"
          Write-Host "Using signtool: $signtool"
          & $signtool sign /f $certPath /p "$env:CERTIFICATE_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 target\release\*.exe
      - name: Build wix
        if: ${{ matrix.package == 'unavi-launcher' }}
        run: |
          cargo wix -p ${{ matrix.package }} --nocapture --no-build
      - name: Package release
        if: ${{ matrix.package != 'unavi-launcher' }}
        shell: bash
        run: |
          mkdir result
          mv target/release/*.exe result
          mv target/release/vcruntime140.dll target/release/vcruntime140_1.dll target/release/msvcp140.dll result/
          cp -r crates/${{ matrix.package }}/assets result/
          cp LICENSE result
      - name: Create tar.xz
        if: ${{ matrix.package != 'unavi-launcher' }}
        shell: bash
        run: |
          cd result
          tar -cf - . | xz --x86 -9e > ../${{ matrix.package }}-x86_64-windows.tar.xz
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.package != 'unavi-launcher' }}
        with:
          name: build-${{ matrix.package }}-x86_64-windows
          path: ${{ matrix.package }}-x86_64-windows.tar.xz
          retention-days: 1
      - name: Create msi
        if: ${{ matrix.package == 'unavi-launcher' }}
        run: |
          ls target/wix/
          mv target/wix/*.msi ${{ matrix.package }}-x86_64-windows.msi
      - name: Sign MSI installer
        if: ${{ matrix.package == 'unavi-launcher' && env.SIGNING_ENABLED == 'true' }}
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          $certPath = "$env:CERTIFICATE_PATH"
          if (-not (Test-Path $certPath)) {
            Write-Error "Certificate file not found at: $certPath"
            exit 1
          }

          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $signtool) {
            Write-Error "signtool.exe not found"
            exit 1
          }

          Write-Host "Using certificate: $certPath"
          Write-Host "Using signtool: $signtool"
          & $signtool sign /f $certPath /p "$env:CERTIFICATE_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 ${{ matrix.package }}-x86_64-windows.msi
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.package == 'unavi-launcher' }}
        with:
          name: build-${{ matrix.package }}-x86_64-windows-installer
          path: ${{ matrix.package }}-x86_64-windows.msi
          retention-days: 1
      - name: Cleanup certificate
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f "${{ env.CERTIFICATE_PATH }}" ]; then
            rm -f "${{ env.CERTIFICATE_PATH }}"
          fi

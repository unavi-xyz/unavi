[package]
edition.workspace    = true
license.workspace    = true
name                 = "unavi-input"
publish              = false
repository.workspace = true
version.workspace    = true

[lints]
workspace = true

[features]
default     = []
devtools    = ["dep:unavi-devtools"]
egui-filter = ["dep:bevy_egui"]

[dependencies]
avian3d.workspace = true
bevy              = { default-features = true, workspace = true }
bevy_egui         = { optional = true, version = "0.40.1" }
schminput         = { branch = "upgrade-bevy-0.19", git = "https://github.com/stevesloan/Schminput" }
unavi-devtools    = { optional = true, path = "../unavi-devtools" }

[target.'cfg(target_family = "wasm")'.dependencies]
schminput_rebinding = { branch = "upgrade-bevy-0.19", default-features = false, git = "https://github.com/stevesloan/Schminput" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
schminput_rebinding = { branch = "upgrade-bevy-0.19", default-features = false, features = [
  "xr",
], git = "https://github.com/stevesloan/Schminput" }

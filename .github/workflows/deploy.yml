name: Deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: git ref to deploy
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: git ref to deploy
        required: false
        type: string
    secrets:
      DEPLOY_SSH_KEY:
        required: true
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  unavi-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: AdityaGarg8/remove-unwanted-software@e379ba59405864059cedd318f38b6574dffd0ef8 # v4
        with:
          remove-android: true
          remove-cached-tools: true
          remove-codeql: true
          remove-docker-images: true
          remove-dotnet: true
          remove-haskell: true
          remove-large-packages: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3
        with:
          extra-conf: |
            extra-experimental-features = pipe-operators
            extra-substituters = file://${{ github.workspace }}/nix-cache
            require-sigs = false
      - name: Fetch build-nix deploy cache
        run: mkdir -p nix-cache
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          pattern: nix-cache-*
          path: nix-cache
          merge-multiple: true
      - name: Get deploy info
        id: deploy_info
        run: |
          SERVER_IP=$(jq -r '.stable.server_ipv4' infra/terraform/deploy.json)
          echo "server_ip=$SERVER_IP" >> "$GITHUB_OUTPUT"
      - name: Setup ssh
        # Pinned instead of ssh-keyscan's trust-on-first-use: requires the
        # DEPLOY_SSH_KNOWN_HOSTS repo (or environment) variable to hold the
        # server's known_hosts line(s), e.g. the one-time output of
        # `ssh-keyscan -t ed25519 <server_ip>` verified out of band. If the
        # droplet is ever recreated with a new host key, this variable must
        # be regenerated.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -z "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
            echo "DEPLOY_SSH_KNOWN_HOSTS is not set; refusing to trust the deploy host on first use" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        # The dev shell's LD_LIBRARY_PATH hands deploy-rs's host ssh tooling
        # Nix's openssl, whose glibc is newer than the runner's.
        run: nix develop --command env -u LD_LIBRARY_PATH deploy .#unavi-stable

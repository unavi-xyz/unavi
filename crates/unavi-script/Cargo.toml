[package]
edition.workspace    = true
license.workspace    = true
name                 = "unavi-script"
publish              = false
repository.workspace = true
version.workspace    = true

[features]
debug = []

[lints]
workspace = true

[dependencies]
anyhow.workspace           = true
async-channel.workspace    = true
avian3d.workspace          = true
bevy                       = { default-features = true, workspace = true }
bevy-hsd.path              = "../bevy-hsd"
bevy-iroh.path             = "../bevy-iroh"
bevy_vrm.workspace         = true
blake3.workspace           = true
bytes.workspace            = true
hsd.path                   = "../hsd"
iroh-docs.workspace        = true
n0-future.workspace        = true
parking_lot.workspace      = true
postcard.workspace         = true
smol_str.workspace         = true
thiserror.workspace        = true
tokio.workspace            = true
tracing.workspace          = true
unavi-agent.path           = "../unavi-agent"
unavi-avatar.path          = "../unavi-avatar"
unavi-identity.path        = "../unavi-identity"
unavi-input.path           = "../unavi-input"
unavi-manifold             = { path = "../unavi-manifold", version = "0.0.16" }
unavi-physics.path         = "../unavi-physics"
unavi-policy.path          = "../unavi-policy"
unavi-portal-protocol.path = "../unavi-portal-protocol"
unavi-registry.path        = "../unavi-registry"
unavi-space.path           = "../unavi-space"
unavi-store.path           = "../unavi-store"
unavi-util.path            = "../unavi-util"
web-time.workspace         = true
xdid.workspace             = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
wasmtime      = "47.0.4"
wasmtime-wasi = "47.0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys                         = "0.3.94"
wasm-bindgen.workspace         = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
avian3d.workspace              = true
bevy-inspector-egui.workspace  = true
bevy_panorbit_camera.workspace = true
iroh.workspace                 = true
iroh-blobs.workspace           = true
tracing-subscriber.workspace   = true
unavi-assets-fetch.path        = "../unavi-assets-fetch"
unavi-grab.path                = "../unavi-grab"

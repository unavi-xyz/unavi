[package]
edition.workspace    = true
license.workspace    = true
name                 = "wds"
publish              = false
repository.workspace = true
version.workspace    = true

[lints]
workspace = true

[dependencies]
anyhow.workspace      = true
blake3.workspace      = true
bytes.workspace       = true
derive_more           = { features = ["debug"], version = "2.1.1" }
futures.workspace     = true
iroh.workspace        = true
iroh-gossip           = { features = ["net"], workspace = true }
irpc                  = { default-features = false, version = "0.17.0" }
irpc-iroh             = "0.17.0"
jose-jwk              = "0.1.2"
n0-future.workspace   = true
p256                  = { default-features = false, features = ["ecdsa"], version = "0.13.2" }
p384                  = { default-features = false, features = ["ecdsa"], version = "0.13.1" }
parking_lot.workspace = true
postcard.workspace    = true
rand.workspace        = true
rusqlite              = { features = ["bundled"], version = "0.39.0" }
scc                   = "3.6.12"
serde.workspace       = true
signature             = "2.2.0"
thiserror.workspace   = true
time.workspace        = true
tokio.workspace       = true
tracing.workspace     = true
xdid.workspace        = true

[target.'cfg(target_family = "wasm")'.dependencies]
iroh-blobs          = { features = ["hide-proto-docs"], workspace = true }
iroh-docs.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
iroh-blobs = { default-features = true, workspace = true }
iroh-docs  = { features = ["fs-store", "rpc"], workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
axum.workspace   = true
rstest.workspace = true
tokio            = { features = ["macros", "rt-multi-thread"], workspace = true }
tracing-test     = { features = ["no-env-filter"], workspace = true }

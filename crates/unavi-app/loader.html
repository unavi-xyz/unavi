<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UNAVI" />
    <meta property="og:site_name" content="unavi.xyz" />
    <meta property="og:title" content="UNAVI" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.unavi.xyz/" />
    <meta property="twitter:domain" content="unavi.xyz" />
    <meta property="twitter:url" content="https://app.unavi.xyz/" />
    <title>UNAVI</title>
    <style>
      html,
      body {
        background-color: #e4d2df;
        margin: 0;
        height: 100%;
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background-color: #e4d2df;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 400ms ease-out;
      }

      .overlay.fading {
        opacity: 0;
        pointer-events: none;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(0, 0, 0, 0.12);
        border-top-color: rgba(0, 0, 0, 0.55);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .progress {
        width: 200px;
        height: 3px;
        border-radius: 2px;
        background: rgba(42, 31, 40, 0.12);
        overflow: hidden;
      }

      .progress-fill {
        width: 0;
        height: 100%;
        border-radius: 2px;
        background: rgba(42, 31, 40, 0.7);
        transition: width 120ms linear;
      }

      .progress.indeterminate .progress-fill {
        width: 40%;
        animation: slide 1.4s ease-in-out infinite;
      }

      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }

      .progress-label {
        min-height: 1em;
        color: #2a1f28;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        font-size: 12px;
        letter-spacing: 0.02em;
        opacity: 0.75;
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }

        .progress.indeterminate .progress-fill {
          animation: none;
          width: 100%;
          opacity: 0.35;
        }

        .progress-fill {
          transition: none;
        }
      }

      .error {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8a1c1c;
        font-family: sans-serif;
        max-width: 32rem;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="overlay" id="overlay">
      <div class="spinner"></div>
      <div class="progress indeterminate" id="progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-label" id="progress-label"></div>
    </div>
    <noscript>UNAVI needs JavaScript enabled to load.</noscript>
    <script>
      (async function () {
        const state = { current: 0, total: null, starting: false, queued: false };

        const showError = (e) => {
          console.error("Failed to load UNAVI:", e);
          const overlay = document.getElementById("overlay");
          if (overlay) overlay.remove();
          const message = document.createElement("div");
          message.className = "error";
          message.textContent = "Failed to load: " + e;
          document.body.appendChild(message);
        };

        const megabytes = (bytes) => (bytes / 1048576).toFixed(1);

        const render = () => {
          const bar = document.getElementById("progress");
          const fill = document.getElementById("progress-fill");
          const label = document.getElementById("progress-label");
          if (!bar || !fill || !label) return;

          const known = state.total !== null;
          bar.classList.toggle("indeterminate", !known && !state.starting);
          if (state.starting) {
            fill.style.width = "100%";
            label.textContent = "Starting…";
          } else if (known) {
            const fraction = Math.min(state.current / state.total, 1);
            fill.style.width = fraction * 100 + "%";
            label.textContent = `Downloading ${megabytes(state.current)} / ${megabytes(state.total)} MB`;
          } else if (state.current > 0) {
            label.textContent = `Downloading ${megabytes(state.current)} MB`;
          }
        };

        // Progress events arrive per network chunk, so draws are batched to one
        // per animation frame.
        const schedule = () => {
          if (state.queued) return;
          state.queued = true;
          requestAnimationFrame(() => {
            state.queued = false;
            render();
          });
        };

        window.addEventListener("unavi-load-progress", (event) => {
          state.current = event.detail.current;
          schedule();
        });
        window.addEventListener("unavi-load-complete", () => {
          state.starting = true;
          schedule();
        });
        window.addEventListener("unavi-load-failed", (event) => {
          showError(event.detail.error);
        });

        try {
          // The uncompressed wasm sizes, which is what the decoded stream counts.
          const sizesPromise = fetch("/sizes.json", { cache: "no-cache" })
            .then((res) => (res.ok ? res.json() : null))
            .catch(() => null);

          let variant = "webgl";
          try {
            if (navigator.gpu && (await navigator.gpu.requestAdapter())) {
              variant = "webgpu";
            }
          } catch (e) {
            console.log("WebGPU detection failed, using WebGL:", e);
          }
          console.log("Loading variant:", variant);

          const sizes = await sizesPromise;
          const total = sizes && sizes[variant];
          if (typeof total === "number" && total > 0) {
            state.total = total;
            schedule();
          }

          // Bevy's wasm asset reader fetches "assets/..." relative to
          // `document.baseURI`, which without this stays "/" since this
          // document never navigates into the variant's own directory.
          const base = document.createElement("base");
          base.href = "/" + variant + "/";
          document.head.appendChild(base);

          // Fetch variant's index.html (paths already absolute from --public-url).
          const res = await fetch("/" + variant + "/index.html");
          if (!res.ok) {
            throw new Error(
              `fetching ${variant}/index.html: ${res.status} ${res.statusText}`,
            );
          }
          const html = await res.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, "text/html");

          // Inject link tags (paths already correct).
          doc
            .querySelectorAll(
              'link[rel="stylesheet"], link[rel="icon"], link[rel="preload"], link[rel="modulepreload"]',
            )
            .forEach((el) => {
              document.head.appendChild(el.cloneNode(true));
            });

          // The overlay stays over the canvas until the app reports its first
          // frames, then fades out and is removed.
          window.addEventListener(
            "unavi-ready",
            () => {
              const overlay = document.getElementById("overlay");
              if (!overlay) return;
              overlay.classList.add("fading");
              setTimeout(() => overlay.remove(), 450);
            },
            { once: true },
          );

          // A failure before Trunk can call onFailure, such as a missing
          // module or an import error, would otherwise leave the bar spinning.
          const failEarly = (event) => {
            if (document.getElementById("overlay")) {
              showError(event.reason ?? event.error ?? event.message);
            }
          };
          window.addEventListener("error", failEarly, { once: true });
          window.addEventListener("unhandledrejection", failEarly, {
            once: true,
          });
          window.addEventListener(
            "unavi-ready",
            () => {
              window.removeEventListener("error", failEarly);
              window.removeEventListener("unhandledrejection", failEarly);
            },
            { once: true },
          );

          // Inject and execute scripts (paths already correct).
          doc.querySelectorAll("script").forEach((el) => {
            const script = document.createElement("script");
            script.onerror = () => showError(`failed to load ${el.src}`);
            if (el.src) script.src = el.src;
            else script.textContent = el.textContent;
            if (el.type) script.type = el.type;
            document.body.appendChild(script);
          });
        } catch (e) {
          showError(e);
        }
      })();
    </script>
  </body>
</html>

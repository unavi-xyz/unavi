[package]
build                = "build.rs"
edition.workspace    = true
license.workspace    = true
name                 = "unavi-client"
publish              = false
repository.workspace = true
version.workspace    = true

[features]
default = ["devtools"]
devtools = [
  "bevy/bevy_dev_tools",
  "bevy/bevy_feathers",
  "bevy/debug",
  "dep:bevy-inspector-egui",
  "dep:unavi-devtools",
  "unavi-input/devtools",
  "unavi-input/egui-filter",
  "unavi-script/debug",
  "unavi-space/devtools",
]
webgpu = ["bevy/webgpu", "unavi-agent/webgpu", "unavi-avatar/webgpu"]

[lints]
workspace = true

[build-dependencies]
embed-resource.workspace = true

[dependencies]
anyhow.workspace        = true
async-channel.workspace = true
avian3d.workspace       = true
bevy                    = { default-features = true, features = ["experimental_pbr_pcss", "https", "jpeg"], workspace = true }
bevy-async.path         = "../bevy-async"
bevy-hsd.path           = "../bevy-hsd"
bevy-inspector-egui     = { optional = true, workspace = true }
bevy-iroh.path          = "../bevy-iroh"
bevy_vrm.workspace      = true
clap.workspace          = true
image                   = { default-features = false, features = ["png"], workspace = true }
iroh.workspace          = true
iroh-docs.workspace     = true
log                     = { features = ["max_level_debug", "release_max_level_warn"], version = "0.4.34" }
n0-future.workspace     = true
parking_lot.workspace   = true
postcard.workspace      = true
tracing                 = { features = ["max_level_debug", "release_max_level_warn"], workspace = true }
unavi-agent.path        = "../unavi-agent"
unavi-assets.path       = "../unavi-assets"
unavi-avatar.path       = "../unavi-avatar"
unavi-config.path       = "../unavi-config"
unavi-devtools          = { optional = true, path = "../unavi-devtools" }
unavi-grab.path         = "../unavi-grab"
unavi-identity.path     = "../unavi-identity"
unavi-input.path        = "../unavi-input"
unavi-local.path        = "../unavi-local"
unavi-physics.path      = "../unavi-physics"
unavi-policy.path       = "../unavi-policy"
unavi-portal.path       = "../unavi-portal"
unavi-registry          = { features = ["client"], path = "../unavi-registry" }
unavi-script.path       = "../unavi-script"
unavi-space.path        = "../unavi-space"
unavi-store.path        = "../unavi-store"
winit                   = { default-features = false, version = "0.30.13" }
xdid.workspace          = true

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { features = ["Location", "UrlSearchParams"], workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy_mod_openxr         = "0.6.0"
bevy_mod_xr.workspace   = true
bevy_xr_utils.workspace = true
directories.workspace   = true

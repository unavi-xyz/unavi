# In-world values the website's tokens.css has no use for. Colours are sRGB
# hex, or `$name` for a property of tokens.css. A key ending in `_alpha` is
# a fraction, `_ms` a duration in milliseconds, `_px` a CSS pixel count.

[field]
cover = "#e4d2df"
shade_hue = 290.0
shade_chroma = 0.04
sky_chroma_max = 0.05

# Em height in milliradians: millimetres of em per metre of reading distance.
[mrad]
small = 14.0
body = 20.0
title = 28.0
display = 40.0

# Data on a slab is laid out in monospace cells.
[mono]
advance = 0.6
line = 1.5
pad_columns = 1.0
pad_lines = 0.5
columns = [24, 40, 64, 80]

[cells]
fill = 0.86
level_off = 0.06
level_ember = 0.45
level_lit = 1.0
colour = "$fg"
attended = "$blue"
travel = 90.0
front_flash = 0.85
front_ms = 200
wake_boost = 0.2
wake_radius = 7
breath = 0.02
glyph_width = 12
key_width = 16
bed_width = 58
bed_gap = 3
bed_margin = 2
cell_row = 12
void_floor = 0.45

# The pane's frosted material. Radius is a fraction of the short side.
[frost]
ground = "#FFFFFF"
ground_alpha = 0.56
blur_px = 18.0
ink = "$fg"
ink_2 = "#5A5A66"
hairline = "$fg"
hairline_alpha = 0.13
fill = "$fg"
fill_alpha = 0.07
edge = "#FFFFFF"
edge_alpha = 0.95
radius = 0.08
shadow = "#6258A0"
shadow_alpha = 0.3
shadow_dx_px = 12.0
shadow_dy_px = 16.0

[motion]
flip_ms = 300
arrive_ms = 700

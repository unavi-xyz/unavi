[package]
edition.workspace    = true
license.workspace    = true
name                 = "unavi-server"
publish              = false
repository.workspace = true
version.workspace    = true

[lints]
workspace = true

[features]
devtools-console = ["dep:console-subscriber", "tokio/tracing"]

[dependencies]
anyhow.workspace      = true
axum.workspace        = true
clap.workspace        = true
console-subscriber    = { optional = true, version = "0.5.0" }
directories.workspace = true
iroh                  = { default-features = true, workspace = true }
iroh-blobs.workspace  = true
iroh-docs.workspace   = true
n0-future.workspace   = true
ron.workspace         = true
serde.workspace       = true
serde_json.workspace  = true
tokio                 = { features = ["full"], workspace = true }
tower-http            = { features = ["cors"], version = "0.6.11" }
tracing.workspace     = true
tracing-subscriber    = { features = ["env-filter"], workspace = true }
unavi-config.path     = "../unavi-config"
unavi-identity.path   = "../unavi-identity"
unavi-local.path      = "../unavi-local"
unavi-registry        = { features = ["server"], path = "../unavi-registry" }
unavi-store.path      = "../unavi-store"
xdid.workspace        = true

[dev-dependencies]
tempfile.workspace = true

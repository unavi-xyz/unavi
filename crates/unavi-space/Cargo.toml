[package]
edition.workspace    = true
license.workspace    = true
name                 = "unavi-space"
publish              = false
repository.workspace = true
version.workspace    = true

[lints]
workspace = true

[dependencies]
anyhow.workspace        = true
async-channel.workspace = true
avian3d.workspace       = true
bevy.workspace          = true
bevy-async.path         = "../bevy-async"
bevy-hsd.path           = "../bevy-hsd"
bevy-iroh.path          = "../bevy-iroh"
blake3.workspace        = true
half                    = { features = ["serde"], version = "2.7.1" }
hsd.path                = "../hsd"
iroh.workspace          = true
iroh-docs.workspace     = true
iroh-gossip             = { features = ["net"], workspace = true }
jiff.workspace          = true
n0-future.workspace     = true
parking_lot.workspace   = true
postcard.workspace      = true
rand.workspace          = true
serde.workspace         = true
serde_vrm               = "0.4.0"
smol_str.workspace      = true
thiserror.workspace     = true
tokio.workspace         = true
tracing.workspace       = true
unavi-agent.path        = "../unavi-agent"
unavi-avatar.path       = "../unavi-avatar"
unavi-grab.path         = "../unavi-grab"
unavi-identity.path     = "../unavi-identity"
unavi-input.path        = "../unavi-input"
unavi-local.path        = "../unavi-local"
unavi-policy.path       = "../unavi-policy"
unavi-portal.path       = "../unavi-portal"
unavi-registry          = { features = ["client"], path = "../unavi-registry" }
unavi-store.path        = "../unavi-store"
web-time.workspace      = true
xdid.workspace          = true

# Without `js`, `Timestamp::now` reads the unimplemented wasm clock.
[target.'cfg(target_family = "wasm")'.dependencies]
jiff = { features = ["js"], workspace = true }

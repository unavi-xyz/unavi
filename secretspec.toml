[project]
extends  = ["crates/unavi-client", "crates/unavi-server"]
name     = "unavi"
revision = "1.0"

[profiles.deploy]
CLOUDFLARE_API_TOKEN      = { description = "Cloudflare API token, scoped to the unavi.xyz zone", required = false }
DIGITALOCEAN_ACCESS_TOKEN = { description = "DigitalOcean API token for droplets, DNS, and projects", required = false }
SPACES_ACCESS_KEY_ID      = { description = "DigitalOcean Spaces access key", required = false }
SPACES_SECRET_ACCESS_KEY  = { description = "DigitalOcean Spaces secret key", required = false }

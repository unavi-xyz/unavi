name: Build Nix
on:
  workflow_call:
    inputs:
      ref:
        description: ref to build
        type: string
jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: generate
        run: |
          APPIMAGE_PACKAGES=("unavi-client" "unavi-launcher")
          BUNDLE_PACKAGES=("unavi-server")
          WEB_PACKAGES=("unavi-client-web")
          SYSTEMS=("x86_64-linux")

          declare -A OS_MAP
          OS_MAP["x86_64-linux"]="ubuntu-latest"

          MATRIX="["
          for SYS in "${SYSTEMS[@]}"; do
            OS="${OS_MAP[$SYS]}"
            for PKG in "${APPIMAGE_PACKAGES[@]}"; do
              [ "$MATRIX" != "[" ] && MATRIX+=","
              MATRIX+="{\"package\":\"$PKG\",\"os\":\"$OS\",\"name\":\"$PKG-$SYS\",\"format\":\"appimage\"}"
            done
            for PKG in "${BUNDLE_PACKAGES[@]}"; do
              [ "$MATRIX" != "[" ] && MATRIX+=","
              MATRIX+="{\"package\":\"$PKG\",\"os\":\"$OS\",\"name\":\"$PKG-$SYS\",\"format\":\"bundle\"}"
            done
            for PKG in "${WEB_PACKAGES[@]}"; do
              [ "$MATRIX" != "[" ] && MATRIX+=","
              MATRIX+="{\"package\":\"$PKG\",\"os\":\"$OS\",\"name\":\"$PKG-$SYS\",\"format\":\"web\"}"
            done
          done
          MATRIX+="]"

          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
  build:
    needs: set-matrix
    strategy:
      matrix:
        include: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: AdityaGarg8/remove-unwanted-software@v4
        with:
          remove-android: true
          remove-cached-tools: true
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: extra-experimental-features = pipe-operators
      - run: nix profile add nixpkgs#xz
      - name: Build AppImage
        if: ${{ matrix.format == 'appimage' }}
        run: |
          nix build -L -o result .#${{ matrix.package }}-appimage
          cp --dereference result ${{ matrix.name }}.AppImage
          chmod +x ${{ matrix.name }}.AppImage
          echo "ARTIFACT=${{ matrix.name }}.AppImage" >> "$GITHUB_ENV"
      - name: Build bundle
        if: ${{ matrix.format == 'bundle' }}
        run: |
          nix bundle -L -o bundle .#${{ matrix.package }}
          cp --dereference bundle ${{ matrix.name }}
          chmod +x ${{ matrix.name }}
          tar -cf - ${{ matrix.name }} | xz --x86 -9e -c > ${{ matrix.name }}.tar.xz
          echo "ARTIFACT=${{ matrix.name }}.tar.xz" >> "$GITHUB_ENV"
      - name: Build web
        if: ${{ matrix.format == 'web' }}
        run: nix build -L -o result .#${{ matrix.package }}
      - name: Upload artifact
        if: ${{ matrix.format != 'web' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.name }}
          path: ${{ env.ARTIFACT }}
          retention-days: 1
      - name: Export deploy cache
        # unavi-server and unavi-client-web are the two packages deploy.yml
        # needs; exporting their closures here lets it skip rebuilding them.
        if: ${{ matrix.package == 'unavi-server' || matrix.package == 'unavi-client-web' }}
        run: |
          mkdir nix-cache
          nix copy --to "file://$PWD/nix-cache" .#${{ matrix.package }}
      - name: Upload deploy cache artifact
        if: ${{ matrix.package == 'unavi-server' || matrix.package == 'unavi-client-web' }}
        uses: actions/upload-artifact@v7
        with:
          name: nix-cache-${{ matrix.name }}
          path: nix-cache
          retention-days: 1

name: Build Nix
on:
  workflow_call:
    inputs:
      ref:
        description: ref to build
        type: string
jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: generate
        run: |
          PACKAGES=("unavi-client" "unavi-launcher" "unavi-server")
          # SYSTEMS=("x86_64-linux" "x86_64-darwin")
          SYSTEMS=("x86_64-linux")

          declare -A OS_MAP
          OS_MAP["x86_64-linux"]="ubuntu-latest"

          MATRIX="["
          for SYS in "${SYSTEMS[@]}"; do
            for PKG in "${PACKAGES[@]}"; do
              [ "$MATRIX" != "[" ] && MATRIX+=","
              OS="${OS_MAP[$SYS]}"
              MATRIX+="{\"package\":\"$PKG\",\"os\":\"$OS\",\"name\":\"$PKG-$SYS\"}"
            done
          done
          MATRIX+="]"

          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
  build:
    needs: set-matrix
    strategy:
      matrix:
        include: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: AdityaGarg8/remove-unwanted-software@v4
        with:
          remove-android: true
          remove-cached-tools: true
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: extra-experimental-features = pipe-operators
      - run: nix profile add nixpkgs#xz
      - name: Build package
        run: |
          # Bundles the full closure so the artifact runs without Nix installed.
          nix bundle -L -o bundle .#${{ matrix.package }}
          cp --dereference bundle ${{ matrix.name }}
          chmod +x ${{ matrix.name }}
          # tar preserves the executable bit through download+extract; a bare
          # xz stream of the binary does not, since Unix permissions aren't
          # part of a compressed byte stream or an HTTP download.
          tar -cf - ${{ matrix.name }} | xz --x86 -9e -c > ${{ matrix.name }}.tar.xz
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.name }}
          path: ${{ matrix.name }}.tar.xz
          retention-days: 1

name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: AdityaGarg8/remove-unwanted-software@v4
        with:
          remove-android: true
          remove-cached-tools: true
          remove-codeql: true
          remove-dotnet: true
          remove-haskell: true
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: DeterminateSystems/flake-checker-action@v13
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: extra-experimental-features = pipe-operators
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
      - run: nix develop .#minimal --command nu scripts/update-wasm.nu
      - run: nix develop .#minimal --command cargo check --examples --tests --all-features --workspace
      - run: nix develop .#minimal --command npm install --prefix crates/unavi-script
      - run: nix develop .#minimal --command nu scripts/build-wasm.nu
      - run: nix develop .#minimal --command cargo nextest run --all-features
      - run: nix develop .#minimal --command cargo clippy --fix --allow-staged --allow-dirty --no-deps --examples --tests --all-features --workspace
      - run: nix fmt
      - uses: EndBug/add-and-commit@v10
        with:
          message: "chore: format"
          default_author: github_actions

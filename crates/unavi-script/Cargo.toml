[package]
edition.workspace    = true
license.workspace    = true
name                 = "unavi-script"
publish              = false
repository.workspace = true
version.workspace    = true

[features]
debug = []

[lints]
workspace = true

[dependencies]
anyhow.workspace           = true
async-channel.workspace    = true
bevy                       = { default-features = true, workspace = true }
bevy-hsd.path              = "../bevy-hsd"
bevy-iroh.path             = "../bevy-iroh"
bevy-wds.path              = "../bevy-wds"
bevy_vrm.workspace         = true
blake3.workspace           = true
bytes.workspace            = true
hsd.path                   = "../hsd"
loro.workspace             = true
loro-surgeon.workspace     = true
parking_lot.workspace      = true
postcard.workspace         = true
rand.workspace             = true
smol_str.workspace         = true
tokio.workspace            = true
tracing.workspace          = true
unavi-agent.path           = "../unavi-agent"
unavi-avatar.path          = "../unavi-avatar"
unavi-input.path           = "../unavi-input"
unavi-portal               = { path = "../unavi-portal", version = "0.0.16" }
unavi-portal-protocol.path = "../unavi-portal-protocol"
unavi-space.path           = "../unavi-space"
unavi-util.path            = "../unavi-util"
wired-records              = { features = ["loro"], path = "../wired-records" }
wired-schemas.path         = "../wired-schemas"
xdid.workspace             = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
sysinfo       = { default-features = false, features = ["system"], version = "0.37.2" }
wasmtime      = "43.0.0"
wasmtime-wasi = "43.0.0"

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys                 = "0.3.97"
wasm-bindgen.workspace = true
wasm-bindgen-futures   = "0.4.70"

[dev-dependencies]
avian3d.workspace              = true
bevy-inspector-egui.workspace  = true
bevy_panorbit_camera.workspace = true
directories.workspace          = true
iroh.workspace                 = true
tracing-subscriber.workspace   = true
wds.path                       = "../wds"

[workspace]
default-members = ["crates/*"]
members         = ["crates/*", "wasm/*"]
resolver        = "3"

[workspace.package]
edition    = "2024"
license    = "MPL-2.0"
repository = "https://github.com/unavi-xyz/unavi"
version    = "0.0.16"

[workspace.lints.clippy]
cast_possible_truncation = "allow"
cast_precision_loss      = "allow"
cast_sign_loss           = "allow"
clone_on_ref_ptr         = "warn"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
nursery                  = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
unwrap_used              = "deny"

# Bevy-specific patterns
needless_pass_by_value = "allow"
too_many_arguments     = "allow"
type_complexity        = "allow"

# wit-bindgen generated code
collection_is_never_read = "allow"
same_length_and_capacity = "allow"

# dioxus macro
volatile_composites = "allow"

[workspace.metadata.release]
publish        = false
shared-version = true
tag-name       = "v{{version}}"

[workspace.dependencies]
anyhow               = "1.0.102"
async-channel        = "2.5.0"
avian3d              = "0.6.1"
axum                 = "0.8.8"
bevy                 = "0.18.1"
bevy_mod_xr          = "0.5.0"
bevy_panorbit_camera = "0.34.0"
bevy_vrm             = "0.3.0"
bevy_xr_utils        = "0.5.0"
blake3               = { features = ["serde"], version = "1.8.4" }
bytemuck             = "1.25.0"
bytes                = "1.11.1"
clap                 = { features = ["derive"], version = "4.6.0" }
directories          = "6.0.0"
embed-resource       = "3.0.8"
futures              = "0.3.32"
glam                 = "0.32.1"
half                 = { features = ["serde"], version = "2.7.1" }
image                = { default-features = false, version = "0.25.10" }
iroh                 = { default-features = false, version = "0.97.0" }
iroh-blobs           = { default-features = false, version = "0.99.0" }
loro                 = "1.10.8"
n0-future            = "0.3.2"
parking_lot          = "0.12.5"
postcard             = { features = ["experimental-derive", "use-std"], version = "1.1.3" }
rand                 = "0.9.2"
reqwest              = "0.13.2"
ron                  = "0.12.1"
scc                  = "3.6.12"
serde                = "1.0.228"
serde_with           = "3.18.0"
smol_str             = { features = ["serde"], version = "0.3.6" }
tempfile             = "3.27.0"
thiserror            = "2.0.18"
time                 = "0.3.47"
tokio                = "1.51.0"
tokio-util           = "0.7.18"
tracing              = "0.1.44"
tracing-subscriber   = "0.3.23"
wasm-bindgen         = "0.2.117"
web-sys              = "0.3.94"
wit-bindgen          = "0.55.0"
xdid                 = "0.7.0"
zeroize              = "1.8.2"

[patch.crates-io]
iroh-blobs = { git = "https://github.com/k-43/iroh-blobs" }

[profile.release]
codegen-units = 1
lto           = true
# panic         = "abort"
# strip         = true

[profile.release-wasm]
inherits  = "release"
opt-level = "z"

[profile.dev]
codegen-backend = "cranelift"

[profile.dev.package."*"]
codegen-backend = "llvm"
opt-level       = 3

[profile.wasm-dev]
inherits  = "dev"
opt-level = 1

# Generated by Dioxus
[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[package]
edition.workspace    = true
license.workspace    = true
name                 = "unavi-registry"
publish              = false
repository.workspace = true
version.workspace    = true

[lints]
workspace = true

[dependencies]
anyhow.workspace    = true
futures.workspace   = true
iroh.workspace      = true
irpc.workspace      = true
irpc-iroh.workspace = true
n0-future.workspace = true
postcard.workspace  = true
scc.workspace       = true
serde.workspace     = true
smol_str.workspace  = true
thiserror.workspace = true
time.workspace      = true
tracing.workspace   = true
wds.path            = "../wds"
xdid.workspace      = true

[target.'cfg(target_family = "wasm")'.dependencies]
iroh-blobs          = { features = ["hide-proto-docs"], workspace = true }
iroh-docs.workspace = true
# Without this `OffsetDateTime::now_utc` reads the unimplemented wasm clock.
time                = { features = ["wasm-bindgen"], workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
iroh-blobs = { default-features = true, workspace = true }
iroh-docs  = { features = ["fs-store", "rpc"], workspace = true }

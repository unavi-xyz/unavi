[package]
edition.workspace    = true
license.workspace    = true
name                 = "unavi-script"
publish              = false
repository.workspace = true
version.workspace    = true

[lints]
workspace = true

[dependencies]
anyhow.workspace        = true
async-channel.workspace = true
bevy                    = { default-features = true, workspace = true }
bevy-hsd.path           = "../bevy-hsd"
bevy-wds.path           = "../bevy-wds"
bevy_vrm.workspace      = true
blake3.workspace        = true
rand.workspace          = true
smol_str.workspace      = true
tokio.workspace         = true
tracing.workspace       = true
unavi-agent.path        = "../unavi-agent"
unavi-avatar.path       = "../unavi-avatar"
unavi-input.path        = "../unavi-input"
unavi-util.path         = "../unavi-util"
unavi-wasm-compat.path  = "../unavi-wasm-compat"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
wasmtime      = "43.0.0"
wasmtime-wasi = "43.0.0"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures   = "0.4.70"

[dev-dependencies]
avian3d.workspace              = true
bevy_panorbit_camera.workspace = true
directories.workspace          = true
iroh.workspace                 = true
tracing-subscriber.workspace   = true
wds.path                       = "../wds"
xdid.workspace                 = true
